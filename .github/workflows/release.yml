# Publishes ZanShield.Sdk to NuGet.org when a version tag such as v1.0.0 is pushed. Uses NuGet
# Trusted Publishing: NuGet.org trusts this workflow in this repository and hands it a short-lived
# key, so no NuGet API key is stored anywhere. See RELEASING.md for the one-time setup.
name: Release to NuGet

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/ZanShield.Sdk
    permissions:
      contents: read
      id-token: write   # lets NuGet.org verify this run is the trusted publisher
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Check the tag matches the package version
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/ZanShield.Sdk/ZanShield.Sdk.csproj)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version> $VERSION"
            exit 1
          fi
      - run: dotnet test --configuration Release
      - run: dotnet pack src/ZanShield.Sdk --configuration Release --output artifacts
      - name: Get a short-lived NuGet key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
